---
layout: default
---
<section class="intro">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>
<ol class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">
      <span class="pl-date"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time></span>
      <span class="pl-title">{{ post.title }}</span>
      {% if post.summary %}<span class="pl-summary">{{ post.summary }}</span>{% endif %}
    </a>
  </li>
  {% endfor %}
</ol>

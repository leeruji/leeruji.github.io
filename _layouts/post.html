---
layout: default
---
<article class="post">
  <header class="post-head">
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="post-summary">{{ page.summary }}</p>{% endif %}
    {% if page.original %}<p class="post-origin">티스토리에서 옮겨 온 글이에요.</p>{% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <nav class="post-nav"><a href="{{ '/' | relative_url }}">← 모든 글</a></nav>
</article>
